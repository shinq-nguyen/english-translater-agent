# Project-scoped Codex config for the "EN Translator for IT" demo repo.
#
# This file only takes effect once you've trusted this project in Codex
# (Codex asks the first time it opens an untrusted folder — see
# demo-material/01-overview.md). Everything here is scoped to this repo; it
# does not touch your global ~/.codex/config.toml.
#
# TOML GOTCHA THAT BIT AN EARLIER VERSION OF THIS FILE: in TOML, every
# key after a [table] header belongs to THAT table until the next header.
# Root-level keys (sandbox_mode, approval_policy below) must be written
# before the first [table] in the file — otherwise they silently become
# keys of whatever table precedes them, and Codex fails with something like
# `Error loading config.toml: invalid type: string "workspace-write",
# expected struct AgentRoleToml in \`agents\`` (that exact error happens
# because `[agents]` treats any key it doesn't recognize as the name of a
# custom agent role). That's why the two root settings are first in this
# file, before any `[section]`.

sandbox_mode = "workspace-write"
approval_policy = "on-request"

[sandbox_workspace_write]
# Demo 8 (exec-policy-hooks) uses `false` to show a git-push escalation.
# Demo 9 (ticket-workflow) deliberately flips it to `true`, exactly
# as described in its P3.5 pre-work. If this checkout already has the Demo 9
# value, restore `false` before presenting Demo 8.
# This is the "later flips network_access = true" case described in
# demo-material/09 §"Exec Policy vs Sandbox"; `ticket-be-dev` runs `mvn test` inside its
# worktree, which needs the network for missing dependencies.
network_access = true
# Maven writes resolved dependencies/plugins to the shared local repo
# below, which sits OUTSIDE every git worktree — without this, each
# `mvn test` run trips the sandbox and either prompts for elevation on
# every dependency write or pushes people toward copying `.m2` per
# worktree (wasteful, and easy to end up stale). Adjust this path if
# you're running the demo from a different machine/account.
writable_roots = ["C:/Users/Sinh/.m2/repository"]

# ---------------------------------------------------------------------------
# Demo 6 — MCP: a read-only Postgres MCP server pointed at the app's own DB.
# Requires `docker compose up -d postgres` to be running first (see
# demo-material/07-demo-mcp.md).
# ---------------------------------------------------------------------------
[mcp_servers.translator_db]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-postgres", "postgresql://translator:translator@localhost:5432/translator"]
startup_timeout_sec = 15
tool_timeout_sec = 30
enabled = true

# ---------------------------------------------------------------------------
# Demo 6 — MCP, Step 4b: a hand-built MCP server (one write_file tool) used
# to prove Codex's sandbox does not wrap MCP server processes. translator_db
# above can't demonstrate this — its query tool is hard-wired read-only at
# the Postgres level, so a write through it fails the same way regardless of
# sandbox_mode. This one actually writes a file, so tightening sandbox_mode
# to "read-only" and calling it is a real write-vs-write comparison against
# the shell tool. Off by default — `enabled = false` here means the same
# thing Step 3b's toggle does: flip it to `true` right before Step 4b, back
# to `false` after, so it isn't paying context rent on every other demo.
# Requires `cd demo-material/mcp-servers/file-writer && npm install` once
# (see 07-demo-mcp.md's Step 4b pre-work).
# ---------------------------------------------------------------------------
[mcp_servers.demo_file_writer]
command = "node"
args = ["demo-material/mcp-servers/file-writer/index.js"]
startup_timeout_sec = 15
tool_timeout_sec = 30
enabled = false

# ---------------------------------------------------------------------------
# Demo 7 — Subagents: cap how many can be open concurrently, so a runaway
# fan-out doesn't happen live. (max_threads is an alias for the real field
# max_concurrent_threads_per_session.) The secret_auditor role itself is
# NOT declared here — it's auto-discovered from .codex/agents/secret-auditor.toml,
# no [agents.secret_auditor] entry needed.
# ---------------------------------------------------------------------------
[agents]
#max_threads = 4
#max_depth = 1
